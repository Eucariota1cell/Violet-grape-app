name: Build Violet Grape APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'violet-grape-source.zip'
      - '.github/workflows/build-violet-grape.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.1"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Descomprimir Violet Grape
        run: unzip -q violet-grape-source.zip

      - name: Compilar APK
        working-directory: VioletGrapeAndroid
        run: gradle assembleDebug --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Violet-Grape-APK
          path: VioletGrapeAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
